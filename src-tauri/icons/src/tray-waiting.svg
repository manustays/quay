

<svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor"
     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
     style="color:#8E8E93; overflow:visible">
  <!-- scaled ~1.18× about the frame centre (11,11), then dropped 3.7 to sit centered -->
  <g transform="translate(11,11) scale(1.18) translate(-11,-11) translate(0,3.7)">
    <!-- buoy, clipped at the waterline (bottom section ~80% visible) -->
    <defs>
      <clipPath id="clip1f"><rect x="-3" y="0" width="28" height="15"/></clipPath>
    </defs>
    <g clip-path="url(#clip1f)">
      <path d="M8.5 7l-2 9h9l-2-9"/>
      <path d="M9 7h4"/>
      <path d="M8 11h6"/>
    </g>
    <!-- swell -->
    <path d="M4.5 15c1.4-.9 2.8-.9 4.2 0s2.8.9 4.2 0 2.8-.9 4.6 0"/>
    <!-- static soft double halo + amber lamp -->
    <circle cx="11" cy="4.1" r="5.9" fill="#FF9F0A" stroke="none" opacity="0.16"/>
    <circle cx="11" cy="4.1" r="4.6" fill="#FF9F0A" stroke="none" opacity="0.32"/>
    <circle cx="11" cy="4.1" r="3.2" fill="#FF9F0A" stroke="none"/>
  </g>
</svg>