[package]
name = "quay"
version = "0.18.0"
description = "Native macOS menubar app to start, stop, and monitor local dev servers, Homebrew services, Docker containers, and CLI tools — with live CPU/memory metrics."
authors = ["Kumar Abhishek <manustays@gmail.com>"]
license = "MIT"
repository = "https://github.com/manustays/quay"
homepage = "https://github.com/manustays/quay"
edition = "2021"

# The quay-hook helper is a separate workspace member (crates/quay-hook), kept
# out of this package so Tauri doesn't auto-bundle it as a secondary app binary
# — it ships only as the bundle resource the app installs at runtime.
[workspace]
members = ["crates/quay-hook"]
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "quay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: keep the user's existing settings.json key order on merge.
serde_json = { version = "1", features = ["preserve_order"] }
dirs = "5"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
ureq = "3.3.0"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-updater = "2"
sysinfo = "0.39"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
